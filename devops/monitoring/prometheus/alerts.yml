groups:
  - name: fraud_detection
    rules:
      - alert: LatenceHaute
        expr: http_request_duration_seconds{quantile="0.95"} > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Latence > 100ms detectee"

      - alert: KafkaLagEleve
        expr: kafka_consumer_group_lag > 10000
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag trop eleve"

      - alert: DriftModele
        expr: avg_over_time(fraud_score_average[1h]) < 0.05
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Possible drift du modele ML"
